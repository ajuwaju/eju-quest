<body>
<div class="backdrop-fallback" aria-hidden="true"></div>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>

<div class="shell">
  <aside class="rail" aria-label="Main">
    <a class="logo" href="#/" aria-label="Neon Pass, hub">
      <svg viewBox="0 0 40 40" aria-hidden="true"><use href="#i-logo"/></svg>
      <b>Neon<span>Pass</span></b>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <button class="iconbtn" id="muteBtn" type="button" aria-pressed="false" aria-label="Sound effects on"><svg><use href="#i-sound"/></svg></button>
      <button class="iconbtn" id="musicBtn" type="button" aria-pressed="false" aria-label="Ambient music"><svg><use href="#i-music"/></svg></button>
    </div>
  </aside>

  <main id="main" tabindex="-1">
    <div class="wrap">
      <div class="topbar">
        <a class="logo" href="#/" aria-label="Neon Pass, hub"><svg viewBox="0 0 40 40" aria-hidden="true"><use href="#i-logo"/></svg><b>Neon<span>Pass</span></b></a>
        <div class="row">
          <button class="iconbtn" id="muteBtnM" type="button" aria-pressed="false" aria-label="Sound effects on"><svg><use href="#i-sound"/></svg></button>
        </div>
      </div>
      <div id="hud"></div>
      <div id="view" aria-live="polite">
        <noscript><div class="panel"><h2>Jack in with JavaScript</h2><p>Neon Pass is a study game and needs JavaScript turned on to run.</p></div></noscript>
      </div>
    </div>
  </main>
</div>

<nav class="mobilebar" id="mobilebar" aria-label="Main"></nav>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div id="overlayRoot"></div>
